services:
  db:
    image: postgres:16
    container_name: imaginepos-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong}
      POSTGRES_DB: ${POSTGRES_DB:-imaginepos}
    volumes:
      - imaginepos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-imaginepos}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  imaginepos_pgdata:
